<script>
const SAMPLES = /*__SAMPLES__*/[];
const E = BD.engine, R = BD.report, TX = BD.taxonomy;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const app = $('#app');

let answers = {};
let history = [];      // question ids in the order shown
let pending = null;    // working value for multi / composite screens
let cta = { time: null, sent: false };

// ---------------------------------------------------------------- routing (live)
const personaOf = () => (answers.Q01 ? E.resolvePersona(answers) : null);
function seq() { return personaOf() === 'SO' ? E.SEQUENCE_SO : E.SEQUENCE_DEFAULT; }
function askable(id, ans) {
  const p = ans.Q01 ? E.resolvePersona(ans) : 'IP';
  const ctx = { persona: p, rawPersona: ans.Q01, get: E.makeGetter(ans, p) };
  if (id !== 'Q01' && !ans.Q01) return false;
  return E.shouldAsk(E.QMAP[id], p, ctx);
}
function nextId(after) {
  // the next question on the current path; answers from questions no longer on the path are ignored
  const live = E.route(answers).answers;
  const s = seq();
  const start = after ? s.indexOf(after) + 1 : 0;
  for (let i = start; i < s.length; i++) if (askable(s[i], live)) return s[i];
  return null;
}
function estimate() {
  const live = E.route(answers).answers;
  if (!live.Q01) return 20;
  let n = 0;
  for (const id of seq()) if (askable(id, live)) n++;
  return Math.max(n, history.length + 1);
}
const SECTION = (q) => ({
  'Business model': 'Your business', 'Revenue / income': 'Your business', 'Capacity / schedule': 'Your schedule', 'Client acquisition': 'New clients', 'Local discovery': 'How people find you',
  'Social media / personal brand': 'How people find you', 'Inquiry → booking': 'Booking', 'Cancellations / no-shows': 'Your schedule', 'Rebooking': 'Clients coming back', 'Client retention': 'Clients coming back',
  'Client database / reactivation': 'Your client list', 'Client reactivation': 'Your client list', 'Pricing': 'Pricing', 'Average ticket': 'What each visit earns', 'Add-ons / retail': 'What each visit earns',
  'Service mix': 'What each visit earns', 'Positioning / clientele': 'Your clients', 'Website / booking experience': 'How people find you', 'Referrals': 'New clients', 'Reviews / reputation': 'Reputation',
  'Automation / follow-up': 'Behind the scenes', 'Financial visibility': 'Your numbers',
})[q.domain] || (q.personas.length === 1 && q.personas[0] === 'SO' ? 'Your salon' : 'Your business');

// ---------------------------------------------------------------- screens
function topbar(step, total) {
  const pct = total ? Math.min(100, Math.round((step / total) * 100)) : 0;
  return `<div class="topbar"><div class="topbar-inner"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Hairstylist Tribe</span>${step != null ? `<span class="progress-label">Question <span class="progress-step">${step} of ~${total}</span></span>` : ''}</div>${step != null ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>` : ''}</div>`;
}

function welcome() {
  history = []; answers = {}; pending = null; cta = { time: null, sent: false };
  app.innerHTML = `${topbar()}
  <section class="hero"><div class="hero-inner">
    <p class="eyebrow">Beauty Business Diagnostic</p>
    <h1 class="display">What’s actually holding your business back?</h1>
    <p class="tagline">It may not be what you think.</p>
    <p class="lede">A short set of questions about how you work, how full you are, what you charge and whether clients come back. At the end you’ll see a full written report: where the real opportunity is, what’s already working, and what I wouldn’t spend money on.</p>
    <ul class="facts">
      <li><strong>About 20 questions.</strong> Mostly one tap each. About 8 minutes.</li>
      <li><strong>Your questions depend on how you work.</strong> Commission stylists, renters, suite owners, salon owners and independent pros each get their own.</li>
      <li><strong>Your full report appears right away.</strong> No call required to see it.</li>
      <li><strong>Rough answers are fine.</strong> “Not sure” is always an option, and it tells us something too.</li>
    </ul>
    <div><button class="btn primary" id="start" type="button">Start the diagnostic</button></div>
  </div></section>
  <main class="wrap"><div class="path">
    <p class="h2">What we’ll look at</p>
    <ul class="path-list"><li>How you work</li><li>How full you are</li><li>New clients</li><li>Who comes back</li><li>What each visit earns</li><li>Your report</li></ul>
  </div></main>`;
  $('#start').addEventListener('click', () => go());
  window.scrollTo(0, 0);
}

function go() {
  const id = nextId();
  if (!id) return analyzing();
  show(id);
}

function show(id) {
  const q = E.QMAP[id];
  const p = personaOf() || 'default';
  if (!history.includes(id)) history.push(id);
  const step = history.indexOf(id) + 1;
  const prompt = E.resolveText(q.text, p);
  const prev = answers[id];
  let body = '';
  if (q.type === 'single') {
    pending = prev ?? null;
    body = `<div class="opts" role="group">${E.optionsFor(q, p).map((o) => optBtn(o, prev === o.v, 'radio')).join('')}</div>`;
  } else if (q.type === 'multi') {
    pending = Array.isArray(prev) ? prev.slice() : [];
    body = `<div class="opts" role="group">${E.optionsFor(q, p).map((o) => optBtn(o, pending.includes(o.v), 'box')).join('')}</div>`;
  } else {
    pending = prev ? { ...prev } : {};
    body = q.rows.map((r) => {
      if (r.type === 'count') {
        if (pending[r.id] == null) pending[r.id] = r.id === 'stations' ? 6 : r.id === 'producing' ? (pending.stations ?? 6) : 0;
        return `<div class="stepper"><span class="lbl">${esc(E.resolveText(r.label, p))}</span><span class="ctl"><button type="button" data-step="${r.id}" data-d="-1" aria-label="Fewer">−</button><output id="out-${r.id}">${pending[r.id]}</output><button type="button" data-step="${r.id}" data-d="1" aria-label="More">+</button></span></div>`;
      }
      return `<div><p class="row-label">${esc(E.resolveText(r.label, p))}</p><div class="chips" role="group">${E.optionsFor(r, p).map((o) => `<button type="button" class="chip" data-row="${r.id}" data-v="${esc(o.v)}" aria-pressed="${pending[r.id] === o.v}">${esc(o.label)}</button>`).join('')}</div></div>`;
    }).join('');
  }
  const needsContinue = q.type !== 'single';
  app.innerHTML = `${topbar(step, estimate())}
  <main class="wrap question">
    <button class="back" type="button" id="back">← ${step > 1 ? 'Back' : 'Start over'}</button>
    <p class="q-section">${esc(SECTION(q))}</p>
    <h1 class="q-prompt">${esc(prompt)}</h1>
    ${q.help ? `<p class="q-help">${esc(q.help)}</p>` : ''}
    <div class="q-body">${body}</div>
    ${needsContinue ? `<div class="sticky-actions"><button class="btn primary" type="button" id="cont">Continue</button></div>` : ''}
  </main>`;
  const refresh = () => { const b = $('#cont'); if (b) b.disabled = !complete(q, pending); };
  refresh();
  $('#back').addEventListener('click', () => {
    const i = history.indexOf(id);
    if (i <= 0) return welcome();
    history = history.slice(0, i);
    show(history[i - 1]);
  });
  app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (q.type === 'single') {
      app.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      commit(id, v);
      setTimeout(() => advance(id), 180);
    } else {
      const solo = ['none', 'unsure'];
      if (solo.includes(v)) pending = pending.includes(v) ? [] : [v];
      else { pending = pending.filter((x) => !solo.includes(x)); pending = pending.includes(v) ? pending.filter((x) => x !== v) : [...pending, v]; }
      app.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', String(pending.includes(x.dataset.v))));
      refresh();
    }
  }));
  app.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
    pending[b.dataset.row] = b.dataset.v;
    app.querySelectorAll(`.chip[data-row="${b.dataset.row}"]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    refresh();
  }));
  app.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
    const r = q.rows.find((x) => x.id === b.dataset.step);
    const v = Math.max(r.min ?? 0, Math.min(r.max ?? 40, (pending[r.id] || 0) + Number(b.dataset.d)));
    pending[r.id] = v; $('#out-' + r.id).textContent = v; refresh();
  }));
  const c = $('#cont');
  if (c) c.addEventListener('click', () => { commit(id, pending); advance(id); });
  window.scrollTo(0, 0);
}
const optBtn = (o, on, kind) => `<button type="button" class="opt" data-v="${esc(o.v)}" aria-pressed="${on}"><span class="check ${kind === 'radio' ? 'radio' : ''}" aria-hidden="true">${kind === 'box' ? '✓' : ''}</span><span class="opt-label">${esc(o.label)}</span></button>`;
function complete(q, v) {
  if (q.type === 'multi') return v.length > 0;
  if (q.type === 'composite') return q.rows.every((r) => v[r.id] != null);
  return v != null;
}
function commit(id, v) { answers[id] = Array.isArray(v) ? v.slice() : typeof v === 'object' && v ? { ...v } : v; }
function advance(from) {
  const id = nextId(from);
  if (!id) return analyzing();
  const i = history.indexOf(id);
  if (i >= 0) history = history.slice(0, i);
  show(id);
}

function analyzing() {
  const run = E.run(answers);
  const rep = R.buildReport(run);
  app.innerHTML = `${topbar()}<main class="wrap analyzing" aria-live="polite">
    <p class="eyebrow">Reading your answers</p>
    <ul class="scan">${['How full your schedule is', 'What each hour earns', 'How many clients come back', 'Where new clients come from', 'Where the real opportunity is'].map((t, i) => `<li style="animation-delay:${i * 0.35}s">${t}</li>`).join('')}</ul>
  </main>`;
  window.scrollTo(0, 0);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => report(run, rep), reduce ? 200 : 2100);
}

// ---------------------------------------------------------------- report
const PILL = { HIGH_PRIORITY: 'p-high', OPPORTUNITY: 'p-medium', WATCH: 'p-lower', HEALTHY: 'p-healthy', STRONG: 'p-healthy' };
const DOT = { HIGH_PRIORITY: 's-fix', OPPORTUNITY: 's-attention', WATCH: 's-attention', HEALTHY: 's-healthy', STRONG: 's-healthy', INSUFFICIENT: 's-unclear', NA: 's-na' };

function report(run, r) {
  const main = r.top.filter((t) => !t.refinement);
  app.innerHTML = `${topbar()}
  <section class="hero"><div class="hero-inner">
    <p class="eyebrow">Your diagnostic · ${esc(r.businessModel.label)}</p>
    <h1 class="display">${esc(r.title)}</h1>
    <p class="headline">${esc(r.headline)}</p>
    ${r.sub ? `<p class="summary">${esc(r.sub)}</p>` : ''}
    ${r.summary ? `<p class="summary small">${esc(r.summary)}</p>` : ''}
  </div></section>
  <main class="wrap">
    ${r.belief ? `<section class="block"><p class="h2">You told us</p><blockquote class="quote">${esc(r.belief.text)}</blockquote></section>` : ''}

    <section class="block"><p class="h2">Your business model</p>
      <p class="model-name">${esc(r.businessModel.label)}</p>
      <p>${esc(r.businessModel.description)}</p>
      <p class="note">${esc(r.businessModel.equationNote)}</p>
    </section>

    <section class="block"><p class="h2">Your business as an equation</p>
      <p class="formula">${esc(r.equation.formula)}</p>
      <ol class="chain">${r.equation.factors.map((f) => `<li class="chain-item ${DOT[f.status] || 's-na'}"><span class="dot" aria-hidden="true"></span><span class="chain-stage">${esc(f.factor)}</span><span class="chain-note">${esc(f.value)}</span><span class="pill ${PILL[f.status] || 'p-neutral'}">${esc(f.statusLabel)}</span></li>`).join('')}</ol>
      <p class="output"><b>Output</b> <span>${esc(r.equation.output)}</span></p>
      ${r.economicModel.flags.map((x) => `<p class="flag">${esc(x)}</p>`).join('')}
      ${r.economicModel.rows.length ? `<details><summary>Show the arithmetic</summary>
        <table class="math"><tbody>${r.economicModel.rows.map((x) => `<tr><th>${esc(x.label)}<small>${esc(x.basis)}</small></th><td>${esc(x.value)}</td></tr>`).join('')}</tbody></table>
        ${r.economicModel.assumptions.map((x) => `<p class="note small" style="margin-top:8px">Assumption: ${esc(x)}</p>`).join('')}
      </details>` : ''}
    </section>

    <section class="block"><p class="h2 big">${main.length ? `The ${main.length === 1 ? 'one thing' : main.length === 2 ? 'two things' : 'three things'} I’d look at first` : 'Small refinements, not fixes'}</p>
      ${r.top.map((t) => card(t)).join('')}
    </section>

    ${r.working.length ? `<section class="block"><p class="h2">What appears to be working</p>
      <ul class="list ok-list">${r.working.map((w) => `<li><span class="ok-area">${esc(w.label)}</span><span class="muted">${esc(w.text)}</span></li>`).join('')}</ul></section>` : ''}

    <section class="block"><div class="dont"><p class="h2 big">What I wouldn’t spend money on right now</p><p class="muted small">Just as useful as knowing what to fix.</p>
      <ul class="dont-list">${r.dontBuy.map((d) => `<li><span class="dont-mark" aria-hidden="true"></span><div><p class="dont-title">${esc(d.title)}</p><p>${esc(d.reason)}</p></div></li>`).join('')}</ul></div></section>

    <section class="block"><div class="insight"><p class="eyebrow">If this were my business</p><p class="insight-title">Here’s the order I’d go in.</p>
      <ol>${r.ifThisWere.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div></section>

    <section class="cta" id="cta">${ctaBody(r)}</section>

    <div class="foot"><span>Estimates use your own answers and the assumptions shown. They’re a starting point for a conversation, not a guarantee.</span><button class="link-btn" type="button" id="again">Start over</button></div>
  </main>`;
  $('#again').addEventListener('click', welcome);
  wireCta(r);
  window.scrollTo(0, 0);
}

function card(t) {
  const cls = t.refinement ? 'c-ref' : t.status === 'HIGH_PRIORITY' ? 'c-fix' : '';
  return `<article class="card ${cls}">
    <div class="card-head"><span class="rank">${String(t.rank).padStart(2, '0')}</span><div class="card-titles"><h2 class="card-title">${esc(t.label)}</h2><span class="pill ${t.refinement ? 'p-lower' : PILL[t.status]}">${esc(t.statusLabel)}</span></div></div>
    ${t.noticed.length ? `<div class="card-sec"><p class="label">What we noticed</p><ul class="evidence">${t.noticed.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
    <div class="card-sec"><p class="label">Why it matters</p><p>${esc(t.whyMatters)}</p></div>
    ${t.money.map((m) => `<div class="money"><p>${esc(m.text)}${m.caveat ? ' ' + esc(m.caveat) : '.'}</p><span class="m">${esc(m.math)}</span></div>`).join('')}
    <div class="card-sec"><p class="label">What I’d investigate next</p><ul class="inv">${t.investigate.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>
    <div class="fix"><p class="label">Recommended next step</p><p class="fix-name">${esc(t.nextStep)}</p>
      ${t.interventions.length ? `<p class="small muted">Usually involves: ${t.interventions.map((i) => esc(i.name)).join(' · ')}</p>` : ''}</div>
  </article>`;
}

function ctaBody(r) {
  if (cta.sent) return `<p class="done-msg">Thanks${cta.name ? ', ' + esc(cta.name.split(' ')[0]) : ''}. In the live version, this request goes straight to Ovi with your answers, and you’ll hear back to set a ${esc((cta.time || '').toLowerCase())} time.</p><p class="small muted">Preview mode: nothing was sent.</p>`;
  return `<p class="h2 big">${esc(r.cta.title)}</p>${r.cta.body.map((b) => `<p class="muted">${esc(b)}</p>`).join('')}
    <form class="form" id="ctaform" novalidate>
      <p class="label">Best time for a 20-minute call</p>
      <div class="chips">${r.cta.options.map((o) => `<button type="button" class="chip" data-time="${esc(o)}" aria-pressed="${cta.time === o}">${esc(o)}</button>`).join('')}</div>
      <div class="fields">
        <label class="fld" for="nm">Your name<input class="field" id="nm" autocomplete="name"></label>
        <label class="fld" for="ph">Mobile number<input class="field" id="ph" type="tel" autocomplete="tel" inputmode="tel"></label>
      </div>
      <p class="small" id="ctaerr" style="color:var(--fix);min-height:1.2em"></p>
      <div><button class="btn primary" type="submit">Request a call</button></div>
    </form>`;
}
function wireCta(r) {
  const f = $('#ctaform');
  if (!f) return;
  f.querySelectorAll('[data-time]').forEach((b) => b.addEventListener('click', () => { cta.time = b.dataset.time; f.querySelectorAll('[data-time]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#nm').value.trim(), phone = $('#ph').value.trim();
    if (!cta.time) return ($('#ctaerr').textContent = 'Pick morning or afternoon.');
    if (!name || phone.replace(/\D/g, '').length < 10) return ($('#ctaerr').textContent = 'Add your name and a 10-digit mobile number.');
    Object.assign(cta, { sent: true, name, phone });
    $('#cta').innerHTML = ctaBody(r);
  });
}

// ---------------------------------------------------------------- samples
$('#sample').innerHTML += SAMPLES.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join('');
$('#sample').addEventListener('change', (e) => {
  if (e.target.value === '') return;
  const s = SAMPLES[Number(e.target.value)];
  answers = JSON.parse(JSON.stringify(s.answers));
  history = E.route(answers).shown.slice();
  cta = { time: null, sent: false };
  const run = E.run(answers);
  report(run, R.buildReport(run));
  e.target.value = '';
});

welcome();
</script>
